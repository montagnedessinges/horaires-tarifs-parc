        value=String(value||'');
        if(optional){
            return '<label class="htp-field"><span>'+escaped(label)+'</span><input type="text" data-gt-appearance="'+key+'" value="'+escaped(value)+'" placeholder="#RRGGBB (vide = thème)"></label>';
