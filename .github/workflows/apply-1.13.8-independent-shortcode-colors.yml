name: Apply 1.13.8 independent shortcode colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-1.13.8-independent-shortcode-colors.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited color separation
        run: |
          python3 .github/scripts/apply_1_13_8.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/group-tariff-publication-contract.php')
          s=p.read_text()
          s=s.replace("const STORE_VERSION = 2') !== false, 'group display settings store migrated to version 2'", "const STORE_VERSION = 3') !== false, 'group display settings store migrated to version 3'")
          p.write_text(s)
          PY
      - name: Validate PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: node --check assets/admin-groups.js
      - name: Run group tariff regressions
        run: |
          PLUGIN_ROOT="$PWD" php tests/group-tariff-display-settings-runtime.php
          PLUGIN_ROOT="$PWD" php tests/group-tariff-shortcode-runtime.php
          PLUGIN_ROOT="$PWD" php tests/group-tariff-publication-contract.php
          PLUGIN_ROOT="$PWD" php tests/group-gratuity-contract.php
      - name: Remove one-shot files and commit
        run: |
          rm -f .github/workflows/apply-1.13.8-independent-shortcode-colors.yml .github/scripts/apply_1_13_8.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add independent colors for group tariff shortcode 1.13.8'
          git push
