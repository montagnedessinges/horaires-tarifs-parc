name: Apply 1.13.8 independent shortcode colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-1.13.8-independent-shortcode-colors.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited color separation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Pattern count != 1 in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # 1) Group display store: add an independent appearance snapshot and row-style map.
          path = 'includes/class-parcs-ht-group-tariff-settings.php'
          replace_once(path, "    const STORE_VERSION = 2;", "    const STORE_VERSION = 3;")

          marker = "    public static function defaults($year = '') {\n"
          helpers = r'''    private static function appearance_defaults() {
        return array(
            'tariff_title_color'=>'',
            'tariff_title_bg_color'=>'#ffffff',
            'tariff_title_bg_transparent'=>'1',
            'payment_title_color'=>'',
            'payment_title_bg_color'=>'#ffffff',
            'payment_title_bg_transparent'=>'1',
            'payment_item_bg_color'=>'#006757',
            'payment_item_text_color'=>'#ffffff',
            'payment_icon_color'=>'#ffffff',
            'payment_border_color'=>'',
            'payment_border_enabled'=>'0',
            'panel_text_color'=>'',
            'panel_border_color'=>'',
            'panel_border_enabled'=>'0',
            'panel_bg_color'=>'#ffffff',
            'panel_bg_transparent'=>'1',
            'price_color'=>'',
            'groups_note_text_color'=>'',
            'groups_note_border_color'=>'',
            'button_bg_color'=>'#006757',
            'button_text_color'=>'#ffffff',
        );
    }

    private static function clean_appearance($value) {
        $value = is_array($value) ? $value : array();
        $defaults = self::appearance_defaults();
        $toggles = array('tariff_title_bg_transparent','payment_title_bg_transparent','payment_border_enabled','panel_border_enabled','panel_bg_transparent');
        $out = array();
        foreach ($defaults as $key => $fallback) {
            if (in_array($key, $toggles, true)) {
                $out[$key] = isset($value[$key]) && (string)$value[$key] === '1' ? '1' : '0';
                continue;
            }
            $raw = array_key_exists($key, $value) ? (string)$value[$key] : (string)$fallback;
            if ($raw === '') {
                $out[$key] = '';
                continue;
            }
            $color = sanitize_hex_color($raw);
            $out[$key] = $color ?: (sanitize_hex_color((string)$fallback) ?: '');
        }
        return $out;
    }

    private static function appearance_from_general($general) {
        $general = is_array($general) ? $general : array();
        return self::clean_appearance(array_replace(self::appearance_defaults(), array_intersect_key($general, self::appearance_defaults())));
    }

    private static function row_style_defaults() {
        return array(
            'label_color'=>'','subtitle_color'=>'','note_color'=>'','price_color'=>'',
            'row_bg_color'=>'#ffffff','row_bg_transparent'=>'1','row_border_color'=>'',
        );
    }

    private static function clean_row_style($value) {
        $value = is_array($value) ? $value : array();
        $defaults = self::row_style_defaults();
        $out = array();
        foreach ($defaults as $key => $fallback) {
            if ($key === 'row_bg_transparent') {
                $out[$key] = isset($value[$key]) && (string)$value[$key] === '1' ? '1' : '0';
                continue;
            }
            $raw = array_key_exists($key, $value) ? (string)$value[$key] : (string)$fallback;
            if ($raw === '') {
                $out[$key] = '';
                continue;
            }
            $color = sanitize_hex_color($raw);
            $out[$key] = $color ?: (sanitize_hex_color((string)$fallback) ?: '');
        }
        return $out;
    }

    private static function clean_row_styles($value) {
        $out = array();
        foreach (is_array($value) ? $value : array() as $row_id => $style) {
            $row_id = sanitize_key((string)$row_id);
            if (!preg_match('/^tariff_row_\\d{6,}$/', $row_id) || !is_array($style)) continue;
            $out[$row_id] = self::clean_row_style($style);
        }
        return $out;
    }

    private static function row_styles_from_rows($rows) {
        $out = array();
        foreach (is_array($rows) ? $rows : array() as $row) {
            if (!is_array($row)) continue;
            $row_id = sanitize_key((string)($row['id'] ?? ''));
            if (!preg_match('/^tariff_row_\\d{6,}$/', $row_id)) continue;
            $source = array(
                'label_color'=>(string)($row['label_color'] ?? ''),
                'subtitle_color'=>(string)($row['subtitle_color'] ?? ($row['detail_color'] ?? '')),
                'note_color'=>(string)($row['note_color'] ?? ''),
                'price_color'=>(string)($row['price_color'] ?? ''),
                'row_bg_color'=>(string)($row['row_bg_color'] ?? '#ffffff'),
                'row_bg_transparent'=>(string)($row['row_bg_transparent'] ?? '1'),
                'row_border_color'=>(string)($row['row_border_color'] ?? ''),
            );
            $out[$row_id] = self::clean_row_style($source);
        }
        return $out;
    }

'''
          replace_once(path, marker, helpers + marker)

          replace_once(path,
              "            'show_info_blocks'=>'0',\n            'info_blocks'=>array(),\n        );",
              "            'show_info_blocks'=>'0',\n            'info_blocks'=>array(),\n            'appearance'=>self::appearance_defaults(),\n            'row_styles'=>array(),\n        );")

          old = """            if (isset($general['groups_button_label']) && is_array($general['groups_button_label'])) {
                $labels = self::clean_translations($general['groups_button_label']);
                foreach ($labels as $lang => $label) if ($label !== '') $row['button_label'][$lang] = $label;
            }
            $store['seasons'][(string)$year] = $row;"""
          new = """            if (isset($general['groups_button_label']) && is_array($general['groups_button_label'])) {
                $labels = self::clean_translations($general['groups_button_label']);
                foreach ($labels as $lang => $label) if ($label !== '') $row['button_label'][$lang] = $label;
            }
            $row['appearance'] = self::appearance_from_general($general);
            $row['row_styles'] = self::row_styles_from_rows($season['tariffs']['groups'] ?? array());
            $store['seasons'][(string)$year] = $row;"""
          replace_once(path, old, new)

          old = """            $saved['version'] = 2;
        }
        return $saved;"""
          new = """            $saved['version'] = 2;
            $version = 2;
        }
        if ($version < 3) {
            $all = self::raw_all_settings();
            $general = is_array($all['general'] ?? null) ? $all['general'] : array();
            foreach ((array)($all['seasons'] ?? array()) as $year => $season) {
                if (!preg_match('/^20\\d{2}$/', (string)$year) || !is_array($season)) continue;
                $old = isset($saved['seasons'][$year]) && is_array($saved['seasons'][$year]) ? $saved['seasons'][$year] : array();
                $row = array_replace_recursive(self::defaults((string)$year), $old);
                if (!isset($old['appearance']) || !is_array($old['appearance'])) {
                    $row['appearance'] = self::appearance_from_general($general);
                } else {
                    $row['appearance'] = self::clean_appearance($old['appearance']);
                }
                if (!isset($old['row_styles']) || !is_array($old['row_styles'])) {
                    $row['row_styles'] = self::row_styles_from_rows($season['tariffs']['groups'] ?? array());
                } else {
                    $row['row_styles'] = self::clean_row_styles($old['row_styles']);
                }
                $saved['seasons'][(string)$year] = $row;
            }
            $saved['version'] = 3;
        }
        return $saved;"""
          replace_once(path, old, new)

          replace_once(path,
              "            'show_info_blocks'=>isset($raw['show_info_blocks']) && (string)$raw['show_info_blocks'] === '1' ? '1' : '0',\n            'info_blocks'=>self::clean_info_blocks($raw['info_blocks'] ?? array()),\n        );",
              "            'show_info_blocks'=>isset($raw['show_info_blocks']) && (string)$raw['show_info_blocks'] === '1' ? '1' : '0',\n            'info_blocks'=>self::clean_info_blocks($raw['info_blocks'] ?? array()),\n            'appearance'=>self::clean_appearance($raw['appearance'] ?? array()),\n            'row_styles'=>self::clean_row_styles($raw['row_styles'] ?? array()),\n        );")

          # 2) AJAX save: accept appearance and row-style JSON payloads.
          path = 'includes/class-parcs-ht-admin-groups.php'
          old = """        $info_blocks = array();
        $info_blocks_json = isset($_POST['info_blocks_json']) && is_string($_POST['info_blocks_json'])
            ? sanitize_textarea_field(wp_unslash($_POST['info_blocks_json']))
            : '';
        if ($info_blocks_json !== '') {
            $decoded = json_decode($info_blocks_json, true);
            if (is_array($decoded)) $info_blocks = $decoded;
        }
        $raw = array("""
          new = """        $info_blocks = array();
        $info_blocks_json = isset($_POST['info_blocks_json']) && is_string($_POST['info_blocks_json'])
            ? sanitize_textarea_field(wp_unslash($_POST['info_blocks_json']))
            : '';
        if ($info_blocks_json !== '') {
            $decoded = json_decode($info_blocks_json, true);
            if (is_array($decoded)) $info_blocks = $decoded;
        }
        $appearance = array();
        $appearance_json = isset($_POST['appearance_json']) && is_string($_POST['appearance_json'])
            ? sanitize_textarea_field(wp_unslash($_POST['appearance_json']))
            : '';
        if ($appearance_json !== '') {
            $decoded = json_decode($appearance_json, true);
            if (is_array($decoded)) $appearance = $decoded;
        }
        $row_styles = array();
        $row_styles_json = isset($_POST['row_styles_json']) && is_string($_POST['row_styles_json'])
            ? sanitize_textarea_field(wp_unslash($_POST['row_styles_json']))
            : '';
        if ($row_styles_json !== '') {
            $decoded = json_decode($row_styles_json, true);
            if (is_array($decoded)) $row_styles = $decoded;
        }
        $raw = array("""
          replace_once(path, old, new)
          replace_once(path,
              "            'payment_methods'=>$payment_methods,\n            'info_blocks'=>$info_blocks,\n            'title'=>array(),",
              "            'payment_methods'=>$payment_methods,\n            'info_blocks'=>$info_blocks,\n            'appearance'=>$appearance,\n            'row_styles'=>$row_styles,\n            'title'=>array(),")

          # 3) Group shortcode: styles come from its own display settings, never from the classic tariff palette/row styles.
          path = 'includes/class-parcs-ht-group-tariffs.php'
          old_start = """    private static function row_style($row) {
        $style = '';
        $map = array(
            'label_color'=>'--htp-row-label',
            'subtitle_color'=>'--htp-row-detail',
            'note_color'=>'--htp-row-note',
            'price_color'=>'--htp-row-price',
            'row_border_color'=>'--htp-row-border',
        );
        foreach ($map as $key=>$var) {
            if (!empty($row[$key]) && ($color = sanitize_hex_color($row[$key]))) $style .= $var . ':' . $color . ';';
        }
        if (!empty($row['row_bg_transparent']) && (string)$row['row_bg_transparent'] === '1') {
            $style .= '--htp-row-bg:transparent;';
        } elseif (!empty($row['row_bg_color']) && ($color = sanitize_hex_color($row['row_bg_color']))) {
            $style .= '--htp-row-bg:' . $color . ';';
        }
        return $style;
    }"""
          new_start = """    private static function row_style($row, $display) {
        $row_id = sanitize_key((string)($row['id'] ?? ''));
        $styles = isset($display['row_styles'][$row_id]) && is_array($display['row_styles'][$row_id]) ? $display['row_styles'][$row_id] : array();
        $style = '';
        $map = array(
            'label_color'=>'--htp-row-label',
            'subtitle_color'=>'--htp-row-detail',
            'note_color'=>'--htp-row-note',
            'price_color'=>'--htp-row-price',
            'row_border_color'=>'--htp-row-border',
        );
        foreach ($map as $key=>$var) {
            if (!empty($styles[$key]) && ($color = sanitize_hex_color($styles[$key]))) $style .= $var . ':' . $color . ';';
        }
        if (!empty($styles['row_bg_transparent']) && (string)$styles['row_bg_transparent'] === '1') {
            $style .= '--htp-row-bg:transparent;';
        } elseif (!empty($styles['row_bg_color']) && ($color = sanitize_hex_color($styles['row_bg_color']))) {
            $style .= '--htp-row-bg:' . $color . ';';
        }
        return $style;
    }"""
          replace_once(path, old_start, new_start)

          old_style = """    private static function style_variables($general) {
        $general = is_array($general) ? $general : array();
        $map = array(
            'primary_color'=>'--htp-primary','secondary_color'=>'--htp-secondary','accent_color'=>'--htp-accent','highlight_color'=>'--htp-highlight',
            'tab_bg_color'=>'--htp-tab-bg','tab_text_color'=>'--htp-tab-text','tab_active_bg_color'=>'--htp-tab-active-bg','tab_active_text_color'=>'--htp-tab-active-text',
            'button_bg_color'=>'--htp-button-bg','button_text_color'=>'--htp-button-text','price_color'=>'--htp-price','groups_note_text_color'=>'--htp-groups-note-text','groups_note_border_color'=>'--htp-groups-note-border',
            'payment_title_color'=>'--htp-payment-title','payment_border_color'=>'--htp-payment-border','payment_item_bg_color'=>'--htp-payment-item-bg','payment_item_text_color'=>'--htp-payment-item-text','payment_icon_color'=>'--htp-payment-icon',
        );
        $style = '';
        foreach ($map as $key=>$variable) {
            if (empty($general[$key])) continue;
            $color = sanitize_hex_color((string)$general[$key]);
            if ($color) $style .= $variable . ':' . $color . ';';
        }
        if (!empty($general['panel_bg_transparent']) && (string)$general['panel_bg_transparent'] === '1') {
            $style .= '--htp-panel-bg:transparent;';
        } elseif (!empty($general['panel_bg_color']) && ($color = sanitize_hex_color((string)$general['panel_bg_color']))) {
            $style .= '--htp-panel-bg:' . $color . ';';
        }
        $style .= '--htp-payment-border-width:' . ((!empty($general['payment_border_enabled']) && (string)$general['payment_border_enabled'] === '1') ? '1px' : '0px') . ';';
        return $style;
    }"""
          new_style = """    private static function style_variables($appearance) {
