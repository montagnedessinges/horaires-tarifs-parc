name: One-time Advent admin refactor 1.15.1

on:
  push:
    branches: [fix/advent-admin-architecture-1.15.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply structural refactor
        run: php tools/refactor-advent-admin-1.15.1.php
      - name: Validate changed PHP
        run: |
          php -l horaires-tarifs-parc.php
          php -l includes/class-parcs-ht-admin.php
          php -l includes/class-parcs-ht-advent-admin.php
          php -l tests/advent-contract.php
          php tests/advent-contract.php
      - name: Commit refactor and remove one-time helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Refactor Advent admin architecture for 1.15.1"
          git push origin HEAD:fix/advent-admin-architecture-1.15.1
