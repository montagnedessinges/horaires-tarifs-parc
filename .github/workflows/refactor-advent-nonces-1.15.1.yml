name: One-time Advent nonce cleanup 1.15.1

on:
  push:
    branches: [fix/advent-admin-architecture-1.15.1]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply nonce refactor
        run: php tools/refactor-advent-nonces-1.15.1.php
      - name: Validate
        run: |
          php -l includes/class-parcs-ht-advent-admin.php
      - name: Commit structural cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Advent nonce lint exemption dependency"
          git push origin HEAD:fix/advent-admin-architecture-1.15.1
