name: Fix calendar title order 1.15.6

on:
  push:
    branches:
      - "fix/calendar-domain-hierarchy-1.15.6"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/calendar-domain-hierarchy-1.15.6"
      - run: python3 tools/fix-calendar-title-order-1.15.6.py
      - run: node --check assets/frontend.js
      - run: |
          rm tools/fix-calendar-title-order-1.15.6.py .github/workflows/fix-calendar-title-order-1.15.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corriger l’ordre du titre des horaires"
          git push origin HEAD:"fix/calendar-domain-hierarchy-1.15.6"
