name: Apply static Shortcodes page

on:
  push:
    paths:
      - '.github/workflows/apply-static-shortcodes-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Shortcodes page directly
        run: python3 tools/apply-static-shortcodes-page.py

      - name: Remove obsolete and temporary files
        run: |
          git rm -f includes/class-parcs-ht-feature-hub.php
          git rm -f tools/apply-static-shortcodes-page.py
          git rm -f .github/workflows/apply-static-shortcodes-page.yml

      - name: Verify direct static page
        run: |
          php -l includes/class-parcs-ht-admin.php
          php -l horaires-tarifs-parc.php
          php tests/shortcode-registry-contract.php

      - name: Commit direct page replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.13.3 — replace Shortcodes page directly"
          git push origin HEAD:main
