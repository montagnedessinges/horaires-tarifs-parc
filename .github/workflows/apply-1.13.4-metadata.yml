name: Apply 1.13.4 release metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply version, changelog and durable rule
        run: php tools/apply-1.13.4-metadata.php
      - name: Verify generated metadata
        shell: bash
        run: |
          grep -q 'Version: 1.13.4' horaires-tarifs-parc.php
          grep -q "PARCS_HT_VERSION', '1.13.4'" horaires-tarifs-parc.php
          grep -q '^## 1.13.4$' CHANGELOG.md
          grep -q 'Compatibilité du shortcode Tarifs groupes' CHATGPT-CONTEXT.md
      - name: Remove one-shot files
        shell: bash
        run: rm -f tools/apply-1.13.4-metadata.php .github/workflows/apply-1.13.4-metadata.yml .release-1.13.4-trigger
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Prepare 1.13.4 — group tariffs shortcode compatibility'
          git push origin HEAD:main
