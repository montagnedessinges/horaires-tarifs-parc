name: One-time Advent admin formatting 1.15.1

on:
  push:
    branches: [fix/advent-admin-architecture-1.15.1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: php tools/format-advent-admin-1.15.1.php
      - run: |
          php -l includes/class-parcs-ht-admin.php
          php tests/advent-contract.php
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Advent admin architecture refactor"
          git push origin HEAD:fix/advent-admin-architecture-1.15.1
