name: Run bump Advent contract 1.15.6

on:
  push:
    branches:
      - "fix/calendar-domain-hierarchy-1.15.6"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/calendar-domain-hierarchy-1.15.6"
          fetch-depth: 0
      - run: python3 tools/bump-advent-contract-1.15.6.py
      - run: php tests/advent-contract.php
      - run: |
          rm tools/bump-advent-contract-1.15.6.py .github/workflows/run-bump-advent-contract-1.15.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adapter le contrat Avent à la version 1.15.6"
          git push origin HEAD:"fix/calendar-domain-hierarchy-1.15.6"
