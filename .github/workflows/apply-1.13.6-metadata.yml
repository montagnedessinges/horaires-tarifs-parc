name: Apply 1.13.6 metadata

on:
  push:
    branches: [main]
    paths:
      - '.release-1.13.6-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 1.13.6 metadata
        run: php tools/apply-1.13.6-metadata.php

      - name: Verify group tariff implementation
        run: |
          php -l includes/class-parcs-ht-group-tariffs.php
          php tests/group-tariff-shortcode-runtime.php

      - name: Remove one-shot files
        run: |
          rm -f tools/apply-1.13.6-metadata.php
          rm -f .github/workflows/apply-1.13.6-metadata.yml
          rm -f .release-1.13.6-trigger

      - name: Commit 1.13.6 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 1.13.6 — MDS group payment information"
          git push origin HEAD:main
