name: Apply calendar domain hierarchy 1.15.6

on:
  push:
    branches:
      - "fix/calendar-domain-hierarchy-1.15.6"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "fix/calendar-domain-hierarchy-1.15.6"
          fetch-depth: 0
      - name: Apply source changes
        run: python3 tools/apply-calendar-domain-1.15.6.py
      - name: Validate changed sources
        run: |
          php -l horaires-tarifs-parc.php
          php -l includes/class-parcs-ht-defaults.php
          php -l includes/class-parcs-ht-admin.php
          node --check assets/frontend.js
          git diff --check
      - name: Commit clean source tree
        run: |
          rm tools/apply-calendar-domain-1.15.6.py
          rm .github/workflows/apply-calendar-domain-1.15.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarifier horaires du parc et accès limité en 1.15.6"
          git push origin HEAD:"fix/calendar-domain-hierarchy-1.15.6"
