name: Sync readme 1.13.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update stable tag
        shell: bash
        run: |
          sed -i 's/^Stable tag: 1\.13\.3$/Stable tag: 1.13.4/' readme.txt
          grep -q '^Stable tag: 1.13.4$' readme.txt
          rm -f .github/workflows/sync-readme-1.13.4.yml .sync-readme-1.13.4-trigger
      - name: Commit readme sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync readme stable tag for 1.13.4'
          git push origin HEAD:main
