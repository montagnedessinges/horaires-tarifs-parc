name: Build and publish WordPress release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horaires-tarifs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure test package manager
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.1'
      - name: Install UI test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install quality tools
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run blocking business and regression tests
        run: |
          php tests/under-five-onsite-runtime.php
          php tests/public-tariff-1167-payments-contract.php
          php tests/public-tariff-1168-groups-contract.php
          php tests/public-content-1170-contract.php
          php tests/admin-overview-1170-contract.php
          php tests/admin-schedule-1173-contract.php
          php tests/admin-periods-1174-contract.php
          php tests/admin-tariffs-1175-contract.php
          php tests/admin-groups-1176-contract.php
          php tests/admin-year-context-1177-runtime.php
          php tests/admin-quotes-1177-contract.php
          php tests/visibility-11512-runtime.php
          php tests/stability-11511-contract.php
          php tests/group-quote-future-season-runtime.php
          php tests/group-tariff-display-settings-runtime.php
          php tests/schedule-engine.php
          php tests/schedule-csv-contract.php
          php tests/popup-language-contract.php
          php tests/tariff-seasons-contract.php
          php tests/tariff-identities-contract.php
          php tests/group-gratuity-contract.php
          php tests/group-tariff-publication-contract.php
          php tests/group-tariff-shortcode-runtime.php
          php tests/shortcode-registry-contract.php
          php tests/admin-shortcode-previews-contract.php
          php tests/admin-shortcode-preview-script-regression.php
          php tests/admin-season-status-contract.php
          php tests/quote-gate-language-contract.php
          php tests/quote-language-save-contract.php
          php tests/groups-no-embedded-guide-previews.php
          php tests/public-data-regressions.php
          php tests/updater-metadata-contract.php
          php tests/pedagogical-guides-contract.php
          php tests/pedagogical-guide-stats-contract.php
          php tests/advent-contract.php
          php tests/advent-ux-contract.php
          php tests/pdf-layout.php /tmp/htp-schedule-test.pdf
      - name: Check JavaScript and parity tests
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          pnpm test
      - name: Test production source cleanup
        shell: bash
        run: |
          rm -rf /tmp/htp-production-test
          mkdir -p /tmp/htp-production-test
          cp -R assets includes /tmp/htp-production-test/
          cp horaires-tarifs-parc.php uninstall.php readme.txt /tmp/htp-production-test/
          php tools/prepare-production.php /tmp/htp-production-test
          find /tmp/htp-production-test -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find /tmp/htp-production-test/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          PLUGIN_ROOT=/tmp/htp-production-test node tests/public-ui-regressions.js
          PLUGIN_ROOT=/tmp/htp-production-test php tests/public-tariff-1167-payments-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/public-tariff-1168-groups-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/public-content-1170-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-overview-1170-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-schedule-1173-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-periods-1174-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-tariffs-1175-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-groups-1176-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-quotes-1177-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/public-data-regressions.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/updater-metadata-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/schedule-csv-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/tariff-identities-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/group-gratuity-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/group-tariff-publication-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/group-tariff-shortcode-runtime.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/shortcode-registry-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-shortcode-previews-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/admin-shortcode-preview-script-regression.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/pedagogical-guides-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/pedagogical-guide-stats-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/advent-contract.php
          PLUGIN_ROOT=/tmp/htp-production-test php tests/advent-ux-contract.php
          grep -q 'Plugin Name: Gestion du parc' /tmp/htp-production-test/horaires-tarifs-parc.php
          if find /tmp/htp-production-test -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' -o -name '*.scss' -o -name '*.sass' -o -name '*.less' \) | grep -q .; then
            echo 'Development source file found after production cleanup.' >&2
            exit 1
          fi
      - name: Enforce WordPress security and PHP compatibility
        run: composer lint

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$s=file_get_contents("horaires-tarifs-parc.php"); preg_match("/Version:\s*([0-9.]+)/",$s,$m); echo $m[1] ?? "";')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Stage audited release sources
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          rm -rf build horaires-tarifs-parc.zip
          mkdir -p build/horaires-tarifs-parc
          cp horaires-tarifs-parc.php uninstall.php build/horaires-tarifs-parc/
          cp -R includes assets build/horaires-tarifs-parc/
      - name: Run official WordPress Plugin Check
        if: steps.existing.outputs.exists != 'true'
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/horaires-tarifs-parc'
          categories: |
            security
            performance
            accessibility
          ignore-warnings: true
          include-experimental: false
      - name: Build production WordPress ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          php tools/prepare-production.php build/horaires-tarifs-parc
          cd build
          zip -qr ../horaires-tarifs-parc.zip horaires-tarifs-parc
      - name: Validate WordPress ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          unzip -t horaires-tarifs-parc.zip
          test "$(zipinfo -1 horaires-tarifs-parc.zip | cut -d/ -f1 | sort -u)" = "horaires-tarifs-parc"
          if zipinfo -1 horaires-tarifs-parc.zip | grep -Ei '\.(md|map|ts|tsx|jsx|scss|sass|less)$|/(tests|tools|vendor|\.github|\.git|\.pkg)/|/(composer\.(json|lock)|phpcs\.xml\.dist|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)$'; then
            echo 'Development, source-map or documentation file found in production ZIP.' >&2
            exit 1
          fi
          unzip -p horaires-tarifs-parc.zip horaires-tarifs-parc/horaires-tarifs-parc.php > /tmp/horaires-tarifs-parc.php
          PACKAGE_VERSION=$(php -r '$s=file_get_contents("/tmp/horaires-tarifs-parc.php"); preg_match("/Version:\\s*([0-9.]+)/",$s,$m); echo $m[1] ?? "";')
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          grep -q 'Plugin Name: Gestion du parc' /tmp/horaires-tarifs-parc.php
          find build/horaires-tarifs-parc -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find build/horaires-tarifs-parc/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          if grep -RniE --include='*.php' --include='*.js' --include='*.css' 'ChatGPT|OpenAI|GitHub Copilot|generated[[:space:]-]+by[[:space:]]+(AI|artificial intelligence)|généré[[:space:]]+par[[:space:]]+(une[[:space:]]+)?IA|sourceMappingURL|TODO|FIXME|HACK|console\.log[[:space:]]*\(|debugger[[:space:]]*;' build/horaires-tarifs-parc; then
            echo 'Development marker found in production sources.' >&2
            exit 1
          fi
          sha256sum horaires-tarifs-parc.zip | tee horaires-tarifs-parc.zip.sha256
      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" horaires-tarifs-parc.zip horaires-tarifs-parc.zip.sha256 \
            --title "Gestion du parc ${{ steps.version.outputs.version }}" \
            --notes-file <(sed -n '/^## ${{ steps.version.outputs.version }}$/,/^## /p' CHANGELOG.md | sed '$d')
      - name: Preserve existing release unchanged
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        run: echo "Release ${{ steps.version.outputs.tag }} already exists; keeping its assets immutable."
