name: Publier la release WordPress

on:
  push:
    branches:
      - main
    paths:
      - '.release/manifest.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruire le package WordPress
        shell: bash
        run: |
          cat .release/part-* | base64 --decode > horaires-tarifs-parc.zip
          unzip -t horaires-tarifs-parc.zip

      - name: Lire la version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version=//p' .release/manifest.txt | head -1)
          if [ -z "$VERSION" ]; then
            echo "Version introuvable dans le manifeste" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier le package
        shell: bash
        run: |
          EXPECTED=$(sed -n 's/^sha256=//p' .release/manifest.txt | head -1)
          ACTUAL=$(sha256sum horaires-tarifs-parc.zip | awk '{print $1}')
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" horaires-tarifs-parc.zip --clobber
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            gh release create "$TAG" horaires-tarifs-parc.zip --title "Horaires & Tarifs Parc $VERSION" --generate-notes
          fi
