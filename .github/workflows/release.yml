name: Build and publish WordPress release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$s=file_get_contents("horaires-tarifs-parc.php"); preg_match("/Version:\s*([0-9.]+)/",$s,$m); echo $m[1] ?? "";')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check PHP syntax
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check assets/admin.js
          node --check assets/frontend.js

      - name: Stop if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build WordPress ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          rm -rf build horaires-tarifs-parc.zip
          mkdir -p build/horaires-tarifs-parc
          rsync -a ./ build/horaires-tarifs-parc/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'horaires-tarifs-parc.zip'
          cd build
          zip -qr ../horaires-tarifs-parc.zip horaires-tarifs-parc

      - name: Validate WordPress ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          unzip -t horaires-tarifs-parc.zip
          test "$(zipinfo -1 horaires-tarifs-parc.zip | cut -d/ -f1 | sort -u)" = "horaires-tarifs-parc"
          unzip -p horaires-tarifs-parc.zip horaires-tarifs-parc/horaires-tarifs-parc.php > /tmp/horaires-tarifs-parc.php
          PACKAGE_VERSION=$(php -r '$s=file_get_contents("/tmp/horaires-tarifs-parc.php"); preg_match("/Version:\\s*([0-9.]+)/",$s,$m); echo $m[1] ?? "";')
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          sha256sum horaires-tarifs-parc.zip | tee horaires-tarifs-parc.zip.sha256

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" horaires-tarifs-parc.zip horaires-tarifs-parc.zip.sha256 \
            --title "Horaires & Tarifs Parc ${{ steps.version.outputs.version }}" \
            --notes-file <(sed -n '/^## ${{ steps.version.outputs.version }}$/,/^## /p' CHANGELOG.md | sed '$d')
