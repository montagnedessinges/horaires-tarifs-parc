name: Fix 1.13.7 JSON input sanitization

on:
  push:
    paths:
      - '.fix-1.13.7-json-input-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize JSON request payloads before decoding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('includes/class-parcs-ht-admin-groups.php')
          text = path.read_text()
          old = """        $payment_methods = array();
                  if (isset($_POST['payment_methods_json'])) {
                      $decoded = json_decode(wp_unslash($_POST['payment_methods_json']), true);
                      if (is_array($decoded)) $payment_methods = $decoded;
                  }
                  $info_blocks = array();
                  if (isset($_POST['info_blocks_json'])) {
                      $decoded = json_decode(wp_unslash($_POST['info_blocks_json']), true);
                      if (is_array($decoded)) $info_blocks = $decoded;
                  }
          """
          new = """        $payment_methods = array();
                  $payment_methods_json = isset($_POST['payment_methods_json']) && is_string($_POST['payment_methods_json'])
                      ? sanitize_textarea_field(wp_unslash($_POST['payment_methods_json']))
                      : '';
                  if ($payment_methods_json !== '') {
                      $decoded = json_decode($payment_methods_json, true);
                      if (is_array($decoded)) $payment_methods = $decoded;
                  }
                  $info_blocks = array();
                  $info_blocks_json = isset($_POST['info_blocks_json']) && is_string($_POST['info_blocks_json'])
                      ? sanitize_textarea_field(wp_unslash($_POST['info_blocks_json']))
                      : '';
                  if ($info_blocks_json !== '') {
                      $decoded = json_decode($info_blocks_json, true);
                      if (is_array($decoded)) $info_blocks = $decoded;
                  }
          """
          if old not in text:
              raise SystemExit('Expected JSON parsing block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate PHP and group regressions
        run: |
          php -l includes/class-parcs-ht-admin-groups.php
          php tests/group-tariff-shortcode-runtime.php
          php tests/group-tariff-publication-contract.php
          php tests/group-tariff-display-settings-runtime.php
          php tests/public-data-regressions.php

      - name: Run WordPress coding standards
        run: |
          composer install --no-interaction --prefer-dist
          composer lint

      - name: Remove one-shot files
        run: rm -f .github/workflows/fix-1.13.7-json-input.yml .fix-1.13.7-json-input-trigger

      - name: Commit sanitization fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 1.13.7 group settings JSON input sanitization'
          git push origin HEAD:main
