name: Fix 1.13.7 read-only migration

on:
  push:
    paths:
      - '.fix-1.13.7-read-only-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep public reads side-effect free
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('includes/class-parcs-ht-group-tariff-settings.php')
          text = settings.read_text()
          old = """    public static function store() {
                  $saved = get_option(self::OPTION, array());
                  $migrated = self::migrate_store($saved);
                  if (!is_array($saved) || wp_json_encode($saved) !== wp_json_encode($migrated)) {
                      update_option(self::OPTION, $migrated, false);
                  }
                  if (!isset($migrated['seasons']) || !is_array($migrated['seasons'])) $migrated['seasons'] = array();
                  $migrated['version'] = self::STORE_VERSION;
                  return $migrated;
              }

              public static function ensure_store() {
                  if (!current_user_can('manage_options')) return;
                  self::store();
              }
          """
          new = """    public static function store($persist = false) {
                  $saved = get_option(self::OPTION, array());
                  $migrated = self::migrate_store($saved);
                  if ($persist && (!is_array($saved) || wp_json_encode($saved) !== wp_json_encode($migrated))) {
                      update_option(self::OPTION, $migrated, false);
                  }
                  if (!isset($migrated['seasons']) || !is_array($migrated['seasons'])) $migrated['seasons'] = array();
                  $migrated['version'] = self::STORE_VERSION;
                  return $migrated;
              }

              public static function ensure_store() {
                  if (!current_user_can('manage_options')) return;
                  self::store(true);
              }
          """
          if old not in text:
              raise SystemExit('settings store block not found')
          settings.write_text(text.replace(old, new, 1))

          test = Path('tests/group-tariff-display-settings-runtime.php')
          text = test.read_text()
          old = """$mds = Parcs_HT_Group_Tariff_Settings::settings('2026');
          setting_assert((int)$GLOBALS['opts'][Parcs_HT_Group_Tariff_Settings::OPTION]['version'] === 2, 'legacy store is migrated to version 2');
          setting_assert($mds['show_payment_methods'] === '1' && count($mds['payment_methods']) === 5, 'existing MDS 1.13.6 payment content is preserved by migration');
          setting_assert($mds['show_info_blocks'] === '1' && count($mds['info_blocks']) === 2, 'existing MDS 1.13.6 information content is preserved by migration');
          """
          new = """$mds = Parcs_HT_Group_Tariff_Settings::settings('2026');
          setting_assert((int)$GLOBALS['opts'][Parcs_HT_Group_Tariff_Settings::OPTION]['version'] === 1, 'public settings read does not rewrite the stored option');
          setting_assert($mds['show_payment_methods'] === '1' && count($mds['payment_methods']) === 5, 'existing MDS 1.13.6 payment content is preserved by in-memory migration');
          setting_assert($mds['show_info_blocks'] === '1' && count($mds['info_blocks']) === 2, 'existing MDS 1.13.6 information content is preserved by in-memory migration');
          Parcs_HT_Group_Tariff_Settings::ensure_store();
          setting_assert((int)$GLOBALS['opts'][Parcs_HT_Group_Tariff_Settings::OPTION]['version'] === 2, 'administration persists the migration to version 2');
          """
          if old not in text:
              raise SystemExit('migration test block not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Validate fix
        run: |
          php -l includes/class-parcs-ht-group-tariff-settings.php
          php -l tests/group-tariff-display-settings-runtime.php
          php tests/group-tariff-display-settings-runtime.php
          php tests/public-data-regressions.php

      - name: Remove one-shot files
        run: rm -f .github/workflows/fix-1.13.7-read-only-migration.yml .fix-1.13.7-read-only-trigger

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 1.13.7 group display migration side effects'
          git push origin HEAD:main
