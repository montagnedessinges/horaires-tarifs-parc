name: Apply 1.13.5 metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-1.13.5-metadata
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare 1.13.5 metadata
        run: php tools/prepare-1.13.5.php
      - name: Verify functional tests affected by the release
        run: |
          php tests/group-tariff-publication-contract.php
          php tests/group-tariff-shortcode-runtime.php
          php -l includes/class-parcs-ht-group-tariffs.php
          php -l horaires-tarifs-parc.php
      - name: Remove one-shot files
        run: |
          rm -f tools/prepare-1.13.5.php
          rm -f .github/workflows/apply-1.13.5-metadata.yml
          rm -f .prepare-1.13.5-trigger
      - name: Commit 1.13.5 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Prepare 1.13.5 — canonical group tariff shortcode"
          git push
