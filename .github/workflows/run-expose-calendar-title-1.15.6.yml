name: Run expose calendar title 1.15.6

on:
  push:
    branches:
      - "fix/calendar-domain-hierarchy-1.15.6"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/calendar-domain-hierarchy-1.15.6"
          fetch-depth: 0
      - run: python3 tools/expose-calendar-title-1.15.6.py
      - run: |
          php -l includes/class-parcs-ht-schedule.php
          php -l tests/public-data-regressions.php
          node --check assets/frontend.js
          git diff --check
      - run: |
          rm tools/expose-calendar-title-1.15.6.py
          rm .github/workflows/run-expose-calendar-title-1.15.6.yml
          rm -f .github/workflows/expose-calendar-title-1.15.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exposer le titre des horaires dans le payload public"
          git push origin HEAD:"fix/calendar-domain-hierarchy-1.15.6"
